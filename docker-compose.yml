services:
  birdnet-api:
    build:
      context: ./server/birdnet-api
      dockerfile: Dockerfile
    container_name: birdnet-api
    # Internal-only inference service -- not published to the host. Express
    # is the only caller, reached over the compose network.
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  express-api:
    build:
      context: .
      dockerfile: server/express-api/Dockerfile
    container_name: express-api
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - BIRDNET_API_URL=http://birdnet-api:8000
      - CORS_ORIGINS=http://localhost:3000
      - DATABASE_PATH=/app/server/express-api/data/birdnet.db
    volumes:
      - ./server/express-api/data:/app/server/express-api/data
    depends_on:
      birdnet-api:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_URL: http://localhost:8080
    container_name: client
    ports:
      - "3000:80"
    depends_on:
      express-api:
        condition: service_started
    restart: unless-stopped
